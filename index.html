
<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inga</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

  <video id="video" autoplay muted playsinline>
    <source src="./inga.mp4" type="video/mp4">
  </video>

  <audio id="music" autoplay loop>
    <source src="./ingainga.mp3" type="audio/mpeg">
  </audio>

  <script>
    const video = document.getElementById("video");
    const music = document.getElementById("music");

    window.addEventListener("load", () => {
      video.play().catch(() => {});
      music.play().catch(() => {});
    });
  </script>

</body>
</html>
